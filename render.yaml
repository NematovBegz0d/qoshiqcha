# Render blueprint — backend bot (Express + Telegraf).
# Yagona kanonik deploy konfiguratsiyasi (bot/render.yaml o'chirildi).
#
# Frontend (TanStack Start) alohida deploy qilinadi — README.md ga qarang.
services:
  - type: web
    name: qoshiqcha-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Webhook rejimi: BOT_WEBHOOK_URL avtomatik RENDER_EXTERNAL_URL + PATH dan olinadi.
      - key: BOT_POLLING
        value: "false"
      - key: BOT_WEBHOOK_PATH
        value: /telegram/webhook
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      # Telegram diagnostika endpointlari himoyasi (/healthz/telegram*).
      - key: HEALTH_CHECK_SECRET
        generateValue: true
